name: Deploy to Cloudflare Pages

# main    → Production（https://pitwu.com）
# staging → Preview   （https://staging.pitwu-web.pages.dev）
# 環境の全体像は docs/environments.md を参照。
on:
  repository_dispatch:
    types: [microcms_update]
  push:
    branches: [main, staging]
  workflow_dispatch:

# 同じブランチへの連続 push は古い方を打ち切る（main と staging は並行して走れる）
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Lint (biome)
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch が Pages の production branch（main）なら Production、それ以外は Preview に入る
          command: pages deploy dist --project-name=pitwu-web --branch=${{ github.ref_name }}
